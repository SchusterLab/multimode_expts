# Fock population data sets (quantum walks and AGP scans): which old job IDs form which data set.
#
# Read by tools/convert_fock_population_catalog.py, which converts the old jobs
# (QsimExperiment + FockPopulationProgram) to the new layout (docs/qsim/mbr_redesign.md,
# section 6; the layers are in experiments/qsim/fock_population.py and agp.py).
#
# Sources: jonginn's catalog in analysis_notebooks/jonginn/convert_legacy_agp.py (commit 7e3a3c3,
# "file associations from the supplied catalog"), and the manifests of the 2026-10-19 stopgap
# backfill (tools/backfill_fock_population.py, never committed) for the quantum walks.
# Job IDs are literal lists, never ranges: the queue is one global counter shared by every user.
#
# Fields
#   calibrations.<name>   four old jobs that prepare Fock 0..3 in M1 at zero cycles and read M1
#   datasets.<name>
#     label        what the data set is
#     kind         walk (one occupation, several read modes) | agp_scan (one CentralBosonAGPExperiment
#                  per disorder strength, then one CentralBosonAGPDisorderScan)
#     folder       experiment folder under the data root (C:\experiments on pippin)
#     calibration  walk: the calibration of its jobs
#     job_ids      walk: the population jobs
#     direction    agp_scan: the initially occupied mode d (0 = M1, else a storage ID)
#     parts        agp_scan: {W in kHz: {calibration, job_ids}}. W labels the disorder strength;
#                  the jobs' detunings are W times one fixed pattern (W = their RMS, in kHz)
#     manifest     the top-level manifest once converted, relative to the data root

calibrations:
  cal_20261017_272:
    folder: agp_k44_first_scan
    job_ids: [JOB-20261017-00272, JOB-20261017-00273, JOB-20261017-00274, JOB-20261017-00275]
