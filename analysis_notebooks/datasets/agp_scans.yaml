# AGP disorder scans (CentralBosonAGPDisorderScan manifests), by key.
#
# Read by experiments/qsim/agp.py: load_scan(key), load_scans(*keys), registered_scans().
# A new data set is one new entry; its key is the name it was saved under
# (CentralBosonAGPDisorderScan_<key>). To see what a folder holds first: list_scans(folder).
# The time-stamp files before 2026-11-03 are in <experiment>/assembled_data_old_20261103.
#
# Fields
#   manifest   the scan manifest, relative to the data root (C:\experiments on pippin)
#   label      what the data set is
#   superseded optional: the key of a newer data set that replaces this one (where they overlap)

scans:
  s7_fine:
    manifest: agp_k44_first_scan/assembled_data/CentralBosonAGPDisorderScan_s7_fine.yaml
    label: N=3, direction S7, W = 0-150 kHz, cycles 0-399 by 1 (122 us); 10-17..19
  s7_coarse:
    manifest: agp_k44_first_scan/assembled_data/CentralBosonAGPDisorderScan_s7_coarse.yaml
    label: N=3, direction S7, W = 0-150 kHz, cycles 0-795 by 5 (244 us); W = 0 from 10-23
  kerr:
    manifest: agp_k44_first_scan/assembled_data/CentralBosonAGPDisorderScan_kerr.yaml
    label: N=3, direction M1 (Kerr), W = 20-200 kHz (245 us); 10-24
  kerr_w0:
    manifest: agp_k44_first_scan/assembled_data/CentralBosonAGPDisorderScan_kerr_w0.yaml
    label: N=3, direction M1 (Kerr), W = 0 only; f0-g1 57 kHz off (lab book Q8 caveat)
  s7_high_w:
    manifest: 261027AGPlowKerr/assembled_data/CentralBosonAGPDisorderScan_s7_high_w.yaml
    label: N=3, direction S7, W = 120, 140, 200 kHz, cycles 0-799 by 1 (245 us); jonginn's 10-29..30 retake
  261105_S5_direction5:
    manifest: 261027AGPlowKerr/assembled_data/CentralBosonAGPDisorderScan_261105_S5_direction5.yaml
    label: N=3, direction S5, W = 0-200 kHz by 20, cycles 0-796 by 4 (244 us); 11-05..06, gap 1
  261105_coarse_dir5:
    manifest: 261027AGPlowKerr/assembled_data/CentralBosonAGPDisorderScan_261105_coarse_dir5.yaml
    label: N=3, direction S5, W = 0 and 200 kHz, cycles 0-256 by 4 (79 us); 11-05, gap 1
  261106_Storage_directions0:
    manifest: 261027AGPlowKerr/assembled_data/CentralBosonAGPDisorderScan_261106_Storage_directions0.yaml
    label: N=3, direction M1 (Kerr), W = 10-110 kHz (dense near 55-65), cycles 0-796 by 4 (244 us); 11-07, gap 1
  261106_Storage_directions5:
    manifest: 261027AGPlowKerr/assembled_data/CentralBosonAGPDisorderScan_261106_Storage_directions5.yaml
    label: N=3, direction S5, W = 0-40 kHz (dense near 9-13), cycles 0-796 by 4 (244 us); 11-06..07, gap 1
  261106_Storage_directions7:
    manifest: 261027AGPlowKerr/assembled_data/CentralBosonAGPDisorderScan_261106_Storage_directions7.yaml
    label: N=3, direction S7, W = 0-40 kHz (dense near 13-18), cycles 0-796 by 4 (244 us); 11-07, gap 1
  s7_ultrafine:
    manifest: agp_k44_first_scan/assembled_data/CentralBosonAGPDisorderScan_s7_ultrafine.yaml
    label: N=3, direction S7, W = 0, 30 kHz, cycles 0-1640 by 10 (503 us); 10-23. Same jobs as the old 261102_161533, which labelled W = 30 as 20
