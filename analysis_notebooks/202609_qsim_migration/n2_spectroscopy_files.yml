description: 'HDF5 job files for the N=2 Hamiltonian spectroscopy reprocessing, moved out of data_postprocess.ipynb
  cell 168 by the stage-2 notebook split. Nesting is [occupation][analyzer phase][file]; the reconstruction
  places files by the analyzer phase saved inside them, not by position here. Ten occupation groups, two
  analyzer phases each, two files per phase = 40 files. Note that cell 167''s markdown says fifteen occupations,
  which this list is not: N=2 over five modes has fifteen occupations, and only ten of them are here.
  That is consistent with the analysis, which builds the full fifteen-state fixed-N basis for theory and
  compares only the measured rows against it -- but the prose overstates what was acquired. Preserved
  as found; confirming which five are absent is a later, theme-specific task.'
